name: SlimeSellwands
version: '${project.version}'
main: com.artillexstudios.axsellwands.AxSellwands

commands:
  axsellwands:
    description: AxSellwands administration
    aliases: [axsellwand, sellwands, sellwand]
    permission: axsellwands.admin
    usage: /axsellwands <help|give|reload|status>

permissions:
  axsellwands.admin:
    description: Manage AxSellwands and give sellwands
    default: op

softdepend:
  - PlaceholderAPI
  - BetterInfinityExpansion
  - InfinityExpansion
  - FluffyMachines
  - Slimefun
  - Vault
  - WorldGuard
